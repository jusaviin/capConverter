<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NHL Team &amp; Roster Map</title>
{% from '_nav.html' import nav_styles, site_nav %}
{{ nav_styles() }}

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">

<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 1000px;
    margin: 60px auto;
    padding: 0 20px;
    color: #1a1a1a;
    background: #fafafa;
  }
  @media (max-width: 600px) {
    body { margin: 24px auto; }
  }
  h1 {
    font-size: 1.4rem;
    margin-bottom: 24px;
  }
  #intro {
    font-size: 0.95rem;
    line-height: 1.5;
    color: #444;
    margin: -8px 0 24px;
    max-width: 640px;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 16px;
    background: #fff;
    padding: 16px 20px;
    border-radius: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    margin-bottom: 16px;
  }
  .mode-toggle {
    display: flex;
    border: 1px solid #ccc;
    border-radius: 6px;
    overflow: hidden;
  }
  .mode-toggle button {
    margin: 0;
    padding: 10px 16px;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 0;
    background: #fff;
    color: #444;
    cursor: pointer;
  }
  .mode-toggle button:hover { background: #f3f4f6; }
  .mode-toggle button.active {
    background: #2563eb;
    color: #fff;
  }
  label {
    font-size: 0.85rem;
    font-weight: 600;
    color: #444;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  select {
    font-size: 1rem;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fff;
    min-width: 150px;
  }
  select:disabled { background: #f3f4f6; color: #888; }
  #team-label[hidden] { display: none; }

  #status {
    font-size: 0.9rem;
    color: #444;
    min-height: 1.3em;
    margin: 0 0 10px;
  }
  #status.error { color: #b91c1c; }

  #map {
    height: 65vh;
    min-height: 380px;
    border-radius: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    background: #e5e7eb;
  }
  .popup-title { font-weight: 600; margin-bottom: 4px; }
  .popup-players { margin: 0; padding-left: 18px; }
</style>
</head>
<body>

<div class="top-bar">
{{ site_nav('map') }}
</div>

<h1>NHL Team &amp; Roster Map</h1>

<p id="intro">
  See where NHL teams play, or where a team's players were born. Pick a season to map every team, or pick a team as well to map its roster's hometowns.
</p>

<div class="controls">
  <div class="mode-toggle" role="group" aria-label="Map type">
    <button type="button" id="mode-teams" class="active" aria-pressed="true">Teams</button>
    <button type="button" id="mode-rosters" aria-pressed="false">Roster</button>
  </div>

  <label>
    Season
    <select id="season-select" disabled></select>
  </label>

  <label id="team-label" hidden>
    Team
    <select id="team-select" disabled></select>
  </label>
</div>

<p id="status" role="status"></p>
<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script>
const map = L.map('map').setView([40, -100], 4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
}).addTo(map);

// Everything we draw goes into this group so a redraw is one clear().
const drawLayer = L.layerGroup().addTo(map);

// False on phones/tablets where the primary input is touch.
const canHover = window.matchMedia('(hover: hover)').matches;

const modeTeamsBtn = document.getElementById('mode-teams');
const modeRostersBtn = document.getElementById('mode-rosters');
const seasonSelect = document.getElementById('season-select');
const teamSelect = document.getElementById('team-select');
const teamLabel = document.getElementById('team-label');
const statusEl = document.getElementById('status');

let mode = 'teams';          // 'teams' | 'rosters'
let teams = [];              // teams for the selected season
let requestCounter = 0;      // used to ignore responses that arrive out of order

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text == null ? '' : String(text);
  return div.innerHTML;
}

// Same season label style as the converter page: 2024 -> "2024-2025"
const seasonLabel = (year) => `${year}-${year + 1}`;

function setStatus(message, isError = false) {
  statusEl.textContent = message;
  statusEl.classList.toggle('error', isError);
}

async function getJson(url) {
  const res = await fetch(url);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Something went wrong.');
  return data;
}

function teamMarker(team, size) {
  const options = { title: team.name };
  if (team.logo) {
    options.icon = L.icon({
      iconUrl: team.logo,
      iconSize: [size, size],
      iconAnchor: [size / 2, size / 2],
      popupAnchor: [0, -size / 2],
    });
  }
  return L.marker(team.coordinates, options)
    .bindTooltip(team.name)
    .bindPopup(`<div class="popup-title">${escapeHtml(team.name)}</div>${escapeHtml(team.city)}`);
}

function drawTeams() {
  drawLayer.clearLayers();
  if (teams.length === 0) {
    setStatus('No teams found for that season.');
    return;
  }

  const cluster = L.markerClusterGroup();
  teams.forEach((team) => cluster.addLayer(teamMarker(team, 60)));
  drawLayer.addLayer(cluster);

  map.fitBounds(L.latLngBounds(teams.map((t) => t.coordinates)), { padding: [30, 30], maxZoom: 6 });
  setStatus(`${teams.length} teams in ${seasonLabel(Number(seasonSelect.value))}.`);
}

function drawRoster(data) {
  drawLayer.clearLayers();

  const points = [data.team.coordinates];
  const cluster = L.markerClusterGroup();

  data.cities.forEach((entry) => {
    const listHtml = entry.players.map((p) => `<li>${escapeHtml(p)}</li>`).join('');
    // Same content for hover (tooltip) and click/tap (popup). Only one
    // of the two is ever visible at a time.
    const details = `<div class="popup-title">${escapeHtml(entry.city)}</div><ul class="popup-players">${listHtml}</ul>`;
    const marker = L.marker(entry.coordinates).bindPopup(details);

    // Touch screens turn a tap into hover + click, which showed both.
    // Only devices that can really hover get the tooltip.
    if (canHover) {
      marker.bindTooltip(details);
      // Once the popup is open (clicked), hide the tooltip and keep
      // it hidden while the mouse is still over the marker.
      marker.on('popupopen', () => marker.closeTooltip());
      marker.on('tooltipopen', () => {
        if (marker.isPopupOpen()) marker.closeTooltip();
      });
    }
    cluster.addLayer(marker);
    points.push(entry.coordinates);
  });

  drawLayer.addLayer(cluster);
  // The team logo sits outside the cluster so it never gets grouped
  // in with the hometown markers.
  drawLayer.addLayer(teamMarker(data.team, 75));

  map.fitBounds(L.latLngBounds(points), { padding: [30, 30], maxZoom: 7 });

  if (data.cities.length === 0) {
    setStatus(`No roster data found for ${data.team.name} in ${seasonLabel(data.season)}.`);
  } else {
    setStatus(
      `${data.team.name}, ${seasonLabel(data.season)}: ${data.player_count} players from ${data.cities.length} hometowns.`
    );
  }
}

async function refresh() {
  const myRequest = ++requestCounter;

  if (mode === 'teams') {
    drawTeams();
    return;
  }

  const team = teamSelect.value;
  const season = seasonSelect.value;
  if (!team || !season) {
    drawLayer.clearLayers();
    setStatus('Choose a team to see its roster.');
    return;
  }

  setStatus('Loading roster...');
  try {
    const data = await getJson(
      `/api/map/roster?team=${encodeURIComponent(team)}&season=${encodeURIComponent(season)}`
    );
    if (myRequest !== requestCounter) return; // a newer selection superseded this one
    drawRoster(data);
  } catch (err) {
    if (myRequest !== requestCounter) return;
    drawLayer.clearLayers();
    setStatus(err.message, true);
  }
}

async function loadTeamsForSeason() {
  const season = seasonSelect.value;
  const previousTeam = teamSelect.value;

  setStatus('Loading teams...');
  teamSelect.disabled = true;
  try {
    const data = await getJson(`/api/map/teams?season=${encodeURIComponent(season)}`);
    if (season !== seasonSelect.value) return; // season changed again while loading
    teams = data.teams;
  } catch (err) {
    teams = [];
    drawLayer.clearLayers();
    setStatus(err.message, true);
  }

  teamSelect.innerHTML = '';
  teams.forEach((team) => {
    const option = document.createElement('option');
    option.value = team.code;
    option.textContent = team.name;
    teamSelect.appendChild(option);
  });
  // Keep the same team selected across seasons when it still exists.
  if (teams.some((t) => t.code === previousTeam)) teamSelect.value = previousTeam;
  teamSelect.disabled = teams.length === 0;

  await refresh();
}

function setMode(newMode) {
  mode = newMode;
  modeTeamsBtn.classList.toggle('active', mode === 'teams');
  modeRostersBtn.classList.toggle('active', mode === 'rosters');
  modeTeamsBtn.setAttribute('aria-pressed', String(mode === 'teams'));
  modeRostersBtn.setAttribute('aria-pressed', String(mode === 'rosters'));
  teamLabel.hidden = mode !== 'rosters';
  refresh();
}

modeTeamsBtn.addEventListener('click', () => setMode('teams'));
modeRostersBtn.addEventListener('click', () => setMode('rosters'));
// Counts a "new selection": the person picked a different season or team.
// The automatic first load and the Teams/Roster toggle are not counted.
// Failures are ignored on purpose -- this must never affect the map.
function logMapEvent() {
  const payload = {
    session_id: VISIT_SESSION_ID,
    mode,
    season: Number(seasonSelect.value),
    team: mode === 'rosters' ? teamSelect.value || null : null,
  };
  fetch('/api/map/event', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
    keepalive: true,
  }).catch(() => {});
}

seasonSelect.addEventListener('change', async () => {
  await loadTeamsForSeason();   // wait, so the final team for the new season is known
  logMapEvent();
});
teamSelect.addEventListener('change', async () => {
  await refresh();
  logMapEvent();
});

async function init() {
  try {
    const data = await getJson('/api/map/seasons');
    if (data.seasons.length === 0) {
      setStatus('No season data available yet.', true);
      return;
    }
    data.seasons.forEach((season) => {
      const option = document.createElement('option');
      option.value = season;
      option.textContent = seasonLabel(season);
      seasonSelect.appendChild(option);
    });
    seasonSelect.disabled = false;   // newest season is selected by default
    await loadTeamsForSeason();
  } catch (err) {
    setStatus(err.message, true);
  }
}

init();
</script>

</body>
</html>
